<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Western Province Flood Web Map
    </title>

    <!-- Leaflet CSS -->
    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    >

    <style>

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            font-family: Arial, Helvetica, sans-serif;
        }

        #map {
            width: 100%;
            height: 100vh;
        }

        /* ===============================
           MAP TITLE
        =============================== */

        .map-title {
            position: absolute;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;

            background: rgba(255,255,255,0.96);
            padding: 10px 18px;
            border-radius: 7px;

            box-shadow:
                0 2px 8px rgba(0,0,0,0.30);

            text-align: center;
            font-size: 17px;
            font-weight: bold;
            max-width: 65%;
            line-height: 1.25;
        }

        .map-subtitle {
            font-size: 14px;
            font-weight: normal;
        }

        /* ===============================
           LEGEND
        =============================== */

        .legend {
            background: rgba(255,255,255,0.96);
            padding: 10px 12px;
            border-radius: 6px;

            box-shadow:
                0 1px 6px rgba(0,0,0,0.35);

            font-size: 13px;
            line-height: 21px;
        }

        .legend-title {
            font-weight: bold;
            margin-bottom: 5px;
        }

        .legend-row {
            display: flex;
            align-items: center;
            margin-top: 3px;
        }

        .legend-color {
            width: 18px;
            height: 18px;
            margin-right: 8px;
            border: 1px solid rgba(0,0,0,0.2);
        }

        /* ===============================
           REPORT BUTTON
        =============================== */

        .report-control {
            background: #d7191c;
            color: white;

            padding: 9px 12px;

            border-radius: 5px;

            font-size: 13px;
            font-weight: bold;

            cursor: pointer;

            box-shadow:
                0 1px 5px rgba(0,0,0,0.4);

            border: 2px solid white;
        }

        .report-control:hover {
            background: #a80000;
        }

        /* ===============================
           REPORT MODAL
        =============================== */

        .modal-overlay {
            display: none;

            position: fixed;

            top: 0;
            left: 0;

            width: 100%;
            height: 100%;

            background:
                rgba(0,0,0,0.55);

            z-index: 3000;

            justify-content: center;
            align-items: center;
        }

        .report-modal {
            background: white;

            width: 420px;
            max-width: 90%;

            max-height: 90vh;
            overflow-y: auto;

            border-radius: 8px;

            box-shadow:
                0 4px 20px rgba(0,0,0,0.35);

            padding: 20px;
        }

        .report-modal h2 {
            margin-top: 0;
            margin-bottom: 5px;
            color: #222;
        }

        .report-modal p {
            font-size: 13px;
            color: #555;
            margin-top: 5px;
        }

        .form-group {
            margin-bottom: 13px;
        }

        .form-group label {
            display: block;
            font-weight: bold;
            font-size: 13px;
            margin-bottom: 5px;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {

            width: 100%;

            box-sizing: border-box;

            padding: 8px;

            border: 1px solid #bbb;

            border-radius: 4px;

            font-size: 14px;
        }

        .form-group textarea {
            resize: vertical;
            min-height: 70px;
        }

        .coordinate-box {
            background: #f3f3f3;

            padding: 9px;

            border-radius: 4px;

            font-size: 12px;

            border: 1px solid #ddd;
        }

        .form-buttons {
            display: flex;
            gap: 10px;
            margin-top: 18px;
        }

        .submit-button {
            flex: 1;

            border: none;

            background: #198754;

            color: white;

            padding: 10px;

            font-weight: bold;

            border-radius: 5px;

            cursor: pointer;
        }

        .submit-button:hover {
            background: #146c43;
        }

        .cancel-button {
            flex: 1;

            border: none;

            background: #666;

            color: white;

            padding: 10px;

            font-weight: bold;

            border-radius: 5px;

            cursor: pointer;
        }

        .cancel-button:hover {
            background: #444;
        }

        .instruction-box {
            display: none;

            position: absolute;

            top: 85px;
            left: 50%;

            transform: translateX(-50%);

            z-index: 2000;

            background: #fff3cd;

            color: #664d03;

            border: 1px solid #ffecb5;

            border-radius: 5px;

            padding: 10px 14px;

            font-size: 14px;

            font-weight: bold;

            box-shadow:
                0 2px 8px rgba(0,0,0,0.25);
        }

        .popup-title {
            font-weight: bold;
            font-size: 14px;
            margin-bottom: 6px;
        }

        .pending-label {
            display: inline-block;

            background: #ffc107;

            color: #222;

            padding: 2px 5px;

            border-radius: 3px;

            font-size: 11px;

            font-weight: bold;
        }

        @media (max-width: 768px) {

            .map-title {
                font-size: 12px;
                padding: 7px 9px;
                max-width: 60%;
            }

            .map-subtitle {
                font-size: 10px;
            }

            .legend {
                font-size: 11px;
                padding: 7px;
            }

            .leaflet-control-layers {
                font-size: 11px;
            }

        }

    </style>

</head>


<body>


    <!-- MAP TITLE -->

    <div class="map-title">

        Interactive Urban Flood Vulnerability and
        Waterlogging Hotspot Reporting Web Map

        <br>

        <span class="map-subtitle">
            Western Province, Sri Lanka
        </span>

    </div>


    <!-- MAP CLICK INSTRUCTION -->

    <div
        id="instructionBox"
        class="instruction-box"
    >
        Click a location on the map to report waterlogging.
    </div>


    <!-- MAP -->

    <div id="map"></div>


    <!-- REPORT FORM MODAL -->

    <div
        id="reportModalOverlay"
        class="modal-overlay"
    >

        <div class="report-modal">

            <h2>
                Report Waterlogging
            </h2>

            <p>
                Submit an observation about flooding or
                waterlogging at the selected location.
            </p>


            <form id="reportForm">


                <div class="form-group">

                    <label>
                        Selected Location
                    </label>

                    <div class="coordinate-box">

                        Latitude:
                        <span id="selectedLatitude">
                            -
                        </span>

                        <br>

                        Longitude:
                        <span id="selectedLongitude">
                            -
                        </span>

                    </div>

                </div>


                <div class="form-group">

                    <label for="incidentType">
                        Incident Type *
                    </label>

                    <select
                        id="incidentType"
                        required
                    >

                        <option value="">
                            Select incident type
                        </option>

                        <option value="Waterlogging">
                            Waterlogging
                        </option>

                        <option value="Road Flooding">
                            Road Flooding
                        </option>

                        <option value="River Flooding">
                            River Flooding
                        </option>

                        <option value="Drain Overflow">
                            Drain Overflow
                        </option>

                    </select>

                </div>


                <div class="form-group">

                    <label for="severity">
                        Severity *
                    </label>

                    <select
                        id="severity"
                        required
                    >

                        <option value="">
                            Select severity
                        </option>

                        <option value="Low">
                            Low
                        </option>

                        <option value="Moderate">
                            Moderate
                        </option>

                        <option value="High">
                            High
                        </option>

                        <option value="Severe">
                            Severe
                        </option>

                    </select>

                </div>


                <div class="form-group">

                    <label for="waterDepth">
                        Estimated Water Depth (cm)
                    </label>

                    <input
                        type="number"
                        id="waterDepth"
                        min="0"
                        max="500"
                        placeholder="Example: 30"
                    >

                </div>


                <div class="form-group">

                    <label for="roadStatus">
                        Road Status
                    </label>

                    <select id="roadStatus">

                        <option value="Unknown">
                            Unknown
                        </option>

                        <option value="Open">
                            Open
                        </option>

                        <option value="Partially Blocked">
                            Partially Blocked
                        </option>

                        <option value="Impassable">
                            Impassable
                        </option>

                    </select>

                </div>


                <div class="form-group">

                    <label for="description">
                        Description
                    </label>

                    <textarea
                        id="description"
                        maxlength="500"
                        placeholder="Briefly describe the situation..."
                    ></textarea>

                </div>


                <div class="form-buttons">

                    <button
                        type="button"
                        class="cancel-button"
                        id="cancelReportButton"
                    >
                        Cancel
                    </button>

                    <button
                        type="submit"
                        class="submit-button"
                    >
                        Submit Report
                    </button>

                </div>


            </form>

        </div>

    </div>


    <!-- LEAFLET JS -->

    <script
        src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
    </script>


    <script>


        /* =========================================
           CREATE MAP
        ========================================= */

        const map = L.map(
            'map'
        );


        const floodBounds = [

            [
                6.324768420900316,
                79.81675029847408
            ],

            [
                7.330522213000532,
                80.38107195995796
            ]

        ];


        map.fitBounds(
            floodBounds,
            {
                padding: [20,20]
            }
        );


        /* =========================================
           BASE MAP
        ========================================= */

        const osm =
            L.tileLayer(

                'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',

                {

                    maxZoom: 19,

                    attribution:
                        '&copy; OpenStreetMap contributors'

                }

            );


        osm.addTo(map);


        /* =========================================
           LAYER GROUPS
        ========================================= */

        const districtLayer =
            L.layerGroup();


        const dsdLayer =
            L.layerGroup();


        const gndLayer =
            L.layerGroup();


        const riverLayer =
            L.layerGroup();


        const waterwayLayer =
            L.layerGroup();


        const roadLayer =
            L.layerGroup();


        const hospitalLayer =
            L.layerGroup();


        const schoolLayer =
            L.layerGroup();


        const hotspotLayer =
            L.layerGroup();


        const publicReportLayer =
            L.layerGroup();


        /* =========================================
           FLOOD SUSCEPTIBILITY
        ========================================= */

        const floodLayer =
            L.imageOverlay(

                'data/flood_susceptibility.png',

                floodBounds,

                {
                    opacity: 0.65
                }

            );


        /* =========================================
           WESTERN PROVINCE
        ========================================= */

        fetch(
            'data/western_province.geojson'
        )

        .then(
            response => response.json()
        )

        .then(
            data => {

                L.geoJSON(

                    data,

                    {

                        style: {

                            color: '#222222',

                            weight: 3,

                            fillOpacity: 0

                        }

                    }

                ).addTo(map);

            }

        );


        /* =========================================
           DISTRICTS
        ========================================= */

        fetch(
            'data/districts.geojson'
        )

        .then(
            response => response.json()
        )

        .then(
            data => {

                L.geoJSON(

                    data,

                    {

                        style: {

                            color: '#0057b8',

                            weight: 2,

                            fillOpacity: 0

                        },


                        onEachFeature:
                            function(
                                feature,
                                layer
                            ) {

                                const p =
                                    feature.properties || {};


                                const name =

                                    p.ADM2_EN ||

                                    p.name ||

                                    p.NAME ||

                                    "District";


                                layer.bindPopup(

                                    "<b>District:</b> "
                                    + name

                                );

                            }

                    }

                ).addTo(
                    districtLayer
                );

            }

        );


        /* =========================================
           DSD
        ========================================= */

        fetch(
            'data/dsd.geojson'
        )

        .then(
            response => response.json()
        )

        .then(
            data => {

                L.geoJSON(

                    data,

                    {

                        style: {

                            color: '#666666',

                            weight: 1.2,

                            fillOpacity: 0

                        }

                    }

                ).addTo(
                    dsdLayer
                );

            }

        );


        /* =========================================
           GND
        ========================================= */

        fetch(
            'data/gnd.geojson'
        )

        .then(
            response => response.json()
        )

        .then(
            data => {

                L.geoJSON(

                    data,

                    {

                        style: {

                            color: '#999999',

                            weight: 0.6,

                            fillOpacity: 0

                        }

                    }

                ).addTo(
                    gndLayer
                );

            }

        );


        /* =========================================
           RIVERS
        ========================================= */

        fetch(
            'data/rivers.geojson'
        )

        .then(
            response => response.json()
        )

        .then(
            data => {

                L.geoJSON(

                    data,

                    {

                        style: {

                            color: '#0066cc',

                            weight: 2.5

                        }

                    }

                ).addTo(
                    riverLayer
                );

            }

        );


        /* =========================================
           WATERWAYS
        ========================================= */

        fetch(
            'data/waterways.geojson'
        )

        .then(
            response => response.json()
        )

        .then(
            data => {

                L.geoJSON(

                    data,

                    {

                        style: {

                            color: '#00a6ff',

                            weight: 1.5

                        }

                    }

                ).addTo(
                    waterwayLayer
                );

            }

        );


        /* =========================================
           MAJOR ROADS
        ========================================= */

        fetch(
            'data/major_roads.geojson'
        )

        .then(
            response => response.json()
        )

        .then(
            data => {

                L.geoJSON(

                    data,

                    {

                        style: {

                            color: '#555555',

                            weight: 1.7

                        }

                    }

                ).addTo(
                    roadLayer
                );

            }

        );


        /* =========================================
           HOSPITALS
        ========================================= */

        fetch(
            'data/hospitals.geojson'
        )

        .then(
            response => response.json()
        )

        .then(
            data => {

                L.geoJSON(

                    data,

                    {

                        pointToLayer:
                            function(
                                feature,
                                latlng
                            ) {

                                return L.circleMarker(

                                    latlng,

                                    {

                                        radius: 5,

                                        fillColor:
                                            '#d7191c',

                                        color:
                                            '#ffffff',

                                        weight: 1,

                                        fillOpacity:
                                            0.9

                                    }

                                );

                            }

                    }

                ).addTo(
                    hospitalLayer
                );

            }

        );


        /* =========================================
           SCHOOLS
        ========================================= */

        fetch(
            'data/schools.geojson'
        )

        .then(
            response => response.json()
        )

        .then(
            data => {

                L.geoJSON(

                    data,

                    {

                        pointToLayer:
                            function(
                                feature,
                                latlng
                            ) {

                                return L.circleMarker(

                                    latlng,

                                    {

                                        radius: 4,

                                        fillColor:
                                            '#7b2cbf',

                                        color:
                                            '#ffffff',

                                        weight: 1,

                                        fillOpacity:
                                            0.85

                                    }

                                );

                            }

                    }

                ).addTo(
                    schoolLayer
                );

            }

        );


        /* =========================================
           HISTORICAL HOTSPOTS
        ========================================= */

        fetch(
            'data/historical_hotspots.geojson'
        )

        .then(
            response => response.json()
        )

        .then(
            data => {

                L.geoJSON(

                    data,

                    {

                        pointToLayer:
                            function(
                                feature,
                                latlng
                            ) {

                                return L.circleMarker(

                                    latlng,

                                    {

                                        radius: 8,

                                        fillColor:
                                            '#ff0000',

                                        color:
                                            '#7a0000',

                                        weight: 2,

                                        fillOpacity:
                                            0.9

                                    }

                                );

                            },


                        onEachFeature:
                            function(
                                feature,
                                layer
                            ) {

                                const p =
                                    feature.properties || {};


                                const popup = `

                                    <div class="popup-title">

                                        Historical
                                        Waterlogging Hotspot

                                    </div>


                                    <b>Location:</b>

                                    ${p.location || "Unknown"}

                                    <br>


                                    <b>District:</b>

                                    ${p.district || "Unknown"}

                                    <br>


                                    <b>Severity:</b>

                                    ${p.severity || "Unknown"}

                                    <br>


                                    <b>Context:</b>

                                    ${p.context || "Not available"}

                                    <br>


                                    <b>Evidence Grade:</b>

                                    ${p.ev_grade || "Unknown"}

                                `;


                                layer.bindPopup(
                                    popup
                                );

                            }

                    }

                ).addTo(
                    hotspotLayer
                );

            }

        );


        /* =========================================
           DEFAULT LAYERS
        ========================================= */

        floodLayer.addTo(map);

        districtLayer.addTo(map);

        hotspotLayer.addTo(map);

        publicReportLayer.addTo(map);


        /* =========================================
           LAYER CONTROL
        ========================================= */

        const baseMaps = {

            "OpenStreetMap":
                osm

        };


        const overlays = {

            "Flood Susceptibility":
                floodLayer,

            "District Boundaries":
                districtLayer,

            "Historical Hotspots":
                hotspotLayer,

            "Current Session Reports":
                publicReportLayer,

            "DSD Boundaries":
                dsdLayer,

            "GND Boundaries":
                gndLayer,

            "Rivers":
                riverLayer,

            "Waterways":
                waterwayLayer,

            "Major Roads":
                roadLayer,

            "Hospitals":
                hospitalLayer,

            "Schools":
                schoolLayer

        };


        L.control.layers(

            baseMaps,

            overlays,

            {

                collapsed: false,

                position: 'topright'

            }

        ).addTo(map);


        /* =========================================
           LEGEND
        ========================================= */

        const legend =
            L.control(

                {
                    position:
                        'bottomright'
                }

            );


        legend.onAdd =
            function() {

                const div =
                    L.DomUtil.create(

                        'div',

                        'legend'

                    );


                div.innerHTML = `

                    <div class="legend-title">
                        Flood Susceptibility
                    </div>

                    <div class="legend-row">

                        <span
                            class="legend-color"
                            style="background:#008000">
                        </span>

                        Very Low

                    </div>

                    <div class="legend-row">

                        <span
                            class="legend-color"
                            style="background:#adff2f">
                        </span>

                        Low

                    </div>

                    <div class="legend-row">

                        <span
                            class="legend-color"
                            style="background:#ffff00">
                        </span>

                        Moderate

                    </div>

                    <div class="legend-row">

                        <span
                            class="legend-color"
                            style="background:#ffa500">
                        </span>

                        High

                    </div>

                    <div class="legend-row">

                        <span
                            class="legend-color"
                            style="background:#ff0000">
                        </span>

                        Very High

                    </div>

                `;


                return div;

            };


        legend.addTo(map);


        /* =========================================
           SCALE BAR
        ========================================= */

        L.control.scale(

            {

                position:
                    'bottomleft',

                metric:
                    true,

                imperial:
                    false

            }

        ).addTo(map);


        /* =========================================
           REPORT WATERLOGGING BUTTON
        ========================================= */

        const reportControl =
            L.control(

                {
                    position:
                        'topleft'
                }

            );


        reportControl.onAdd =
            function() {

                const div =
                    L.DomUtil.create(

                        'div',

                        'report-control'

                    );


                div.innerHTML =
                    '⚠ Report Waterlogging';


                div.title =
                    'Submit a new waterlogging report';


                L.DomEvent.disableClickPropagation(
                    div
                );


                div.onclick =
                    function() {

                        startReportMode();

                    };


                return div;

            };


        reportControl.addTo(map);


        /* =========================================
           REPORTING VARIABLES
        ========================================= */

        let reportMode = false;

        let selectedLat = null;

        let selectedLng = null;

        let temporaryMarker = null;


        const instructionBox =
            document.getElementById(
                'instructionBox'
            );


        const modalOverlay =
            document.getElementById(
                'reportModalOverlay'
            );


        const reportForm =
            document.getElementById(
                'reportForm'
            );


        const cancelButton =
            document.getElementById(
                'cancelReportButton'
            );


        /* =========================================
           START REPORT MODE
        ========================================= */

        function startReportMode() {

            reportMode = true;

            instructionBox.style.display =
                'block';


            map.getContainer().style.cursor =
                'crosshair';

        }


        /* =========================================
           CLICK MAP TO SELECT LOCATION
        ========================================= */

        map.on(

            'click',

            function(e) {

                if (!reportMode) {

                    return;

                }


                selectedLat =
                    e.latlng.lat;


                selectedLng =
                    e.latlng.lng;


                if (temporaryMarker) {

                    map.removeLayer(
                        temporaryMarker
                    );

                }


                temporaryMarker =
                    L.marker(

                        [
                            selectedLat,
                            selectedLng
                        ]

                    ).addTo(map);


                document.getElementById(
                    'selectedLatitude'
                ).textContent =

                    selectedLat.toFixed(6);


                document.getElementById(
                    'selectedLongitude'
                ).textContent =

                    selectedLng.toFixed(6);


                instructionBox.style.display =
                    'none';


                map.getContainer().style.cursor =
                    '';


                reportMode = false;


                modalOverlay.style.display =
                    'flex';

            }

        );


        /* =========================================
           CANCEL REPORT
        ========================================= */

        cancelButton.addEventListener(

            'click',

            function() {

                closeReportForm();

            }

        );


        function closeReportForm() {

            modalOverlay.style.display =
                'none';


            instructionBox.style.display =
                'none';


            reportMode = false;


            map.getContainer().style.cursor =
                '';


            if (temporaryMarker) {

                map.removeLayer(
                    temporaryMarker
                );

                temporaryMarker = null;

            }


            reportForm.reset();

        }


        /* =========================================
           SUBMIT REPORT
        ========================================= */

        reportForm.addEventListener(

            'submit',

            function(event) {

                event.preventDefault();


                if (
                    selectedLat === null ||
                    selectedLng === null
                ) {

                    alert(
                        'Please select a location on the map.'
                    );

                    return;

                }


                const incidentType =
                    document.getElementById(
                        'incidentType'
                    ).value;


                const severity =
                    document.getElementById(
                        'severity'
                    ).value;


                const waterDepth =
                    document.getElementById(
                        'waterDepth'
                    ).value;


                const roadStatus =
                    document.getElementById(
                        'roadStatus'
                    ).value;


                const description =
                    document.getElementById(
                        'description'
                    ).value;


                const reportTime =
                    new Date();


                const reportMarker =
                    L.circleMarker(

                        [
                            selectedLat,
                            selectedLng
                        ],

                        {

                            radius: 9,

                            fillColor:
                                '#0066ff',

                            color:
                                '#ffffff',

                            weight: 2,

                            fillOpacity:
                                0.95

                        }

                    );


                const popup = `

                    <div class="popup-title">

                        Public Waterlogging Report

                    </div>


                    <span class="pending-label">

                        Pending Verification

                    </span>


                    <br><br>


                    <b>Incident Type:</b>

                    ${incidentType}


                    <br>


                    <b>Severity:</b>

                    ${severity}


                    <br>


                    <b>Water Depth:</b>

                    ${
                        waterDepth
                        ? waterDepth + " cm"
                        : "Not provided"
                    }


                    <br>


                    <b>Road Status:</b>

                    ${roadStatus}


                    <br>


                    <b>Description:</b>

                    ${
                        description ||
                        "Not provided"
                    }


                    <br>


                    <b>Latitude:</b>

                    ${selectedLat.toFixed(6)}


                    <br>


                    <b>Longitude:</b>

                    ${selectedLng.toFixed(6)}


                    <br>


                    <b>Report Time:</b>

                    ${reportTime.toLocaleString()}

                `;


                reportMarker.bindPopup(
                    popup
                );


                reportMarker.addTo(
                    publicReportLayer
                );


                if (temporaryMarker) {

                    map.removeLayer(
                        temporaryMarker
                    );

                    temporaryMarker =
                        null;

                }


                modalOverlay.style.display =
                    'none';


                reportForm.reset();


                reportMarker.openPopup();


                alert(
                    'Report submitted successfully. This test report is marked as Pending Verification.'
                );


                selectedLat = null;

                selectedLng = null;

            }

        );


        /* =========================================
           PREVENT TITLE INTERACTION ISSUES
        ========================================= */

        const title =
            document.querySelector(
                '.map-title'
            );


        L.DomEvent.disableClickPropagation(
            title
        );


        console.log(
            'Flood web map and reporting interface loaded.'
        );


    </script>


</body>

</html>
