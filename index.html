<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Western Province Flood Web Map</title>

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  />

  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      font-family: Arial, sans-serif;
    }

    #map {
      width: 100%;
      height: 100vh;
    }

    .map-title {
      position: absolute;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 1000;
      background: rgba(255, 255, 255, 0.95);
      padding: 10px 16px;
      border-radius: 6px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.25);
      text-align: center;
      font-weight: bold;
      max-width: 70%;
    }

    .legend {
      background: white;
      padding: 10px;
      line-height: 20px;
      border-radius: 5px;
      box-shadow: 0 1px 5px rgba(0,0,0,0.4);
    }

    .legend i {
      width: 18px;
      height: 18px;
      float: left;
      margin-right: 8px;
      opacity: 0.8;
    }
  </style>
</head>

<body>

  <div class="map-title">
    Interactive Urban Flood Vulnerability and Waterlogging Hotspot Reporting Web Map
    <br>
    Western Province, Sri Lanka
  </div>

  <div id="map"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>

    // CREATE MAP
    const map = L.map('map').setView([6.9, 79.95], 9);


    // BASE MAP
    const osm = L.tileLayer(
      'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
      {
        maxZoom: 19,
        attribution: '&copy; OpenStreetMap contributors'
      }
    );

    osm.addTo(map);


    // WESTERN PROVINCE BOUNDARY
    fetch('data/western_province.geojson')
      .then(response => response.json())
      .then(data => {

        const provinceLayer = L.geoJSON(data, {
          style: {
            color: '#222222',
            weight: 3,
            fillOpacity: 0
          }
        }).addTo(map);

        map.fitBounds(provinceLayer.getBounds());
      });


    // DISTRICTS
    const districtLayer = L.layerGroup();

    fetch('data/districts.geojson')
      .then(response => response.json())
      .then(data => {

        L.geoJSON(data, {
          style: {
            color: '#555555',
            weight: 2,
            fillOpacity: 0
          },

          onEachFeature: function(feature, layer) {
            const name =
              feature.properties.ADM2_EN ||
              feature.properties.name ||
              "District";

            layer.bindPopup(
              "<b>District:</b> " + name
            );
          }
        }).addTo(districtLayer);

      });


    // DSD
    const dsdLayer = L.layerGroup();

    fetch('data/dsd.geojson')
      .then(response => response.json())
      .then(data => {

        L.geoJSON(data, {
          style: {
            color: '#777777',
            weight: 1,
            fillOpacity: 0
          },

          onEachFeature: function(feature, layer) {
            const name =
              feature.properties.ADM3_EN ||
              feature.properties.name ||
              "DSD";

            layer.bindPopup(
              "<b>DSD:</b> " + name
            );
          }
        }).addTo(dsdLayer);

      });


    // GND
    const gndLayer = L.layerGroup();

    fetch('data/gnd.geojson')
      .then(response => response.json())
      .then(data => {

        L.geoJSON(data, {
          style: {
            color: '#aaaaaa',
            weight: 0.6,
            fillOpacity: 0
          }
        }).addTo(gndLayer);

      });


    // RIVERS
    const riverLayer = L.layerGroup();

    fetch('data/rivers.geojson')
      .then(response => response.json())
      .then(data => {

        L.geoJSON(data, {
          style: {
            color: '#0066cc',
            weight: 2
          },

          onEachFeature: function(feature, layer) {
            const name =
              feature.properties.NAME ||
              feature.properties.name ||
              "River";

            layer.bindPopup(
              "<b>River:</b> " + name
            );
          }
        }).addTo(riverLayer);

      });


    // WATERWAYS
    const waterwayLayer = L.layerGroup();

    fetch('data/waterways.geojson')
      .then(response => response.json())
      .then(data => {

        L.geoJSON(data, {
          style: {
            color: '#33aaff',
            weight: 1.5
          },

          onEachFeature: function(feature, layer) {
            const name =
              feature.properties.name ||
              "Waterway";

            layer.bindPopup(
              "<b>Waterway:</b> " + name
            );
          }
        }).addTo(waterwayLayer);

      });


    // MAJOR ROADS
    const roadLayer = L.layerGroup();

    fetch('data/major_roads.geojson')
      .then(response => response.json())
      .then(data => {

        L.geoJSON(data, {
          style: {
            color: '#555555',
            weight: 1.5
          },

          onEachFeature: function(feature, layer) {
            const name =
              feature.properties.name ||
              feature.properties.ref ||
              "Major Road";

            layer.bindPopup(
              "<b>Road:</b> " + name
            );
          }
        }).addTo(roadLayer);

      });


    // HOSPITALS
    const hospitalLayer = L.layerGroup();

    fetch('data/hospitals.geojson')
      .then(response => response.json())
      .then(data => {

        L.geoJSON(data, {

          pointToLayer: function(feature, latlng) {
            return L.circleMarker(latlng, {
              radius: 5,
              fillColor: '#cc0000',
              color: '#ffffff',
              weight: 1,
              fillOpacity: 0.9
            });
          },

          onEachFeature: function(feature, layer) {
            const p = feature.properties;

            const name =
              p.hospital_n ||
              p.name ||
              p.NAME ||
              "Hospital";

            layer.bindPopup(
              "<b>Hospital</b><br>" + name
            );
          }

        }).addTo(hospitalLayer);

      });


    // SCHOOLS
    const schoolLayer = L.layerGroup();

    fetch('data/schools.geojson')
      .then(response => response.json())
      .then(data => {

        L.geoJSON(data, {

          pointToLayer: function(feature, latlng) {
            return L.circleMarker(latlng, {
              radius: 4,
              fillColor: '#8a2be2',
              color: '#ffffff',
              weight: 1,
              fillOpacity: 0.9
            });
          },

          onEachFeature: function(feature, layer) {
            const p = feature.properties;

            const name =
              p.school_nam ||
              p.name ||
              p.NAME ||
              "School";

            layer.bindPopup(
              "<b>School</b><br>" + name
            );
          }

        }).addTo(schoolLayer);

      });


    // HISTORICAL WATERLOGGING HOTSPOTS
    const hotspotLayer = L.layerGroup();

    fetch('data/historical_hotspots.geojson')
      .then(response => response.json())
      .then(data => {

        L.geoJSON(data, {

          pointToLayer: function(feature, latlng) {
            return L.circleMarker(latlng, {
              radius: 7,
              fillColor: '#ff0000',
              color: '#660000',
              weight: 2,
              fillOpacity: 0.9
            });
          },

          onEachFeature: function(feature, layer) {

            const p = feature.properties;

            const popup = `
              <b>Historical Waterlogging Hotspot</b>
              <br><br>

              <b>Location:</b>
              ${p.location || "Unknown"}

              <br>

              <b>District:</b>
              ${p.district || "Unknown"}

              <br>

              <b>Severity:</b>
              ${p.severity || "Unknown"}

              <br>

              <b>Context:</b>
              ${p.context || "Not available"}

              <br>

              <b>Evidence Grade:</b>
              ${p.ev_grade || "Unknown"}
            `;

            layer.bindPopup(popup);
          }

        }).addTo(hotspotLayer);

      });


    // FLOOD SUSCEPTIBILITY IMAGE
    const floodBounds = [
      [6.324768420900316, 79.81675029847408],
      [7.330522213000532, 80.38107195995796]
    ];

    const floodLayer = L.imageOverlay(
      'data/flood_susceptibility.png',
      floodBounds,
      {
        opacity: 0.65
      }
    );


    // DEFAULT LAYERS
    floodLayer.addTo(map);
    districtLayer.addTo(map);
    hotspotLayer.addTo(map);


    // LAYER CONTROL
    const baseMaps = {
      "OpenStreetMap": osm
    };

    const overlays = {
      "Flood Susceptibility": floodLayer,
      "District Boundaries": districtLayer,
      "DSD Boundaries": dsdLayer,
      "GND Boundaries": gndLayer,
      "Rivers": riverLayer,
      "Waterways": waterwayLayer,
      "Major Roads": roadLayer,
      "Hospitals": hospitalLayer,
      "Schools": schoolLayer,
      "Historical Hotspots": hotspotLayer
    };

    L.control.layers(
      baseMaps,
      overlays,
      {
        collapsed: false
      }
    ).addTo(map);


    // LEGEND
    const legend = L.control({
      position: 'bottomright'
    });

    legend.onAdd = function() {

      const div = L.DomUtil.create(
        'div',
        'legend'
      );

      div.innerHTML = `
        <b>Flood Susceptibility</b>
        <br>

        <i style="background:#008000"></i>
        Very Low
        <br>

        <i style="background:#adff2f"></i>
        Low
        <br>

        <i style="background:#ffff00"></i>
        Moderate
        <br>

        <i style="background:#ffa500"></i>
        High
        <br>

        <i style="background:#ff0000"></i>
        Very High
      `;

      return div;
    };

    legend.addTo(map);

  </script>

</body>
</html>
